# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: fire_heat_and_radius
    status: active
    source: design/gdd/fire.md
    referenced_by:
      - design/gdd/fire.md
      - design/gdd/thermal-environment.md
      - design/gdd/morale-and-mental-state.md
    variables:
      - F
      - w_burn
    output_range: [0, 27.8]
    expression: "s = 1-exp(-F/60); heat_c = 28*s*(1-0.4*w_burn) (embers 4); radius_m = 0.8+2.6*s (embers 1.0); light = 1.5+5*s"
    notes: "F 120 dry -> 24.2 C / 3.05 m / light 5.8 m. warm_radius = radius_m registered in Thermal."
    added: 2026-11-17
    revised: ""
  - name: fire_burn_rate
    status: active
    source: design/gdd/fire.md
    referenced_by:
      - design/gdd/fire.md
      - design/gdd/gathering.md
      - design/gdd/map-and-resource-distribution.md
    variables:
      - F
      - wind_eff
      - ringed
    output_range: [0.25, 2.2]
    expression: "(0.25 + F/240) * (1 + 0.08*wind_eff*(ringed ? 0.6 : 1)) fuel units per game minute"
    notes: "~0.84 dry logs/h at F 120 ringed; 4 bedtime logs -> embers after ~5.5 h; ~8 logs per night."
    added: 2026-11-17
    revised: ""
  - name: gather_yield
    status: active
    source: design/gdd/gathering.md
    referenced_by:
      - design/gdd/gathering.md
      - design/gdd/map-and-resource-distribution.md
      - design/gdd/mishaps-and-failure.md
    variables:
      - take
      - remaining
      - success
    output_range: [0, 3]
    expression: "attempted = min(take, remaining); kept = success ? attempted : (chop ? 0 : floor(attempted/2)); remaining -= success ? attempted : 0"
    notes: "Takes: bush 3 sticks (+1 grass), deadfall 2 sticks or 1 log, birch 2 bark, grass 2, stones 1. Produce wetness: standing bush 0.0, deadfall 0.3 (forest 0.2), birch 0.0, grass 0.1 lee / 0.4 open."
    added: 2026-11-17
    revised: ""
  - name: p_fail
    status: active
    source: design/gdd/mishaps-and-failure.md
    referenced_by:
      - design/gdd/mishaps-and-failure.md
      - design/gdd/morale-and-mental-state.md
      - design/gdd/body-temperature.md
      - design/gdd/needs-and-weight.md
      - design/gdd/interaction-and-timed-actions.md
    variables:
      - base_fail
      - c_damp
      - c_wind
      - c_tinder
      - reliability_penalty
      - cold_hands_penalty
      - fatigue_penalty
    output_range: [0, 0.90]
    expression: "clamp(base + k_damp*wetness + k_wind*max(0, wind_eff-2) + k_tinder*(1-quality) + morale + cold_hands + fatigue, 0, 0.90)"
    notes: "Named cause = largest physical term >= 0.05 else fumble; morale never named. Strike base 0.35 (dry birch, open snow, healthy = 0.406)."
    added: 2026-11-17
    revised: ""
  - name: ice_break_per_footfall
    status: active
    source: design/gdd/mishaps-and-failure.md
    referenced_by:
      - design/gdd/mishaps-and-failure.md
      - design/gdd/terrain-and-snow-surface.md
    variables:
      - thickness
      - carry_load_frac
      - hurrying
    output_range: [0, 0.09]
    expression: "thickness >= 15 ? 0 : 0.03*(15-thickness)/15*(1+0.5*load)*(hurry ? 2 : 1)"
    notes: "On break: fell_in_water, cell broken, major failure to Morale, 10% chance to lose a carried tool (hatchet 2:1:1)."
    added: 2026-11-17
    revised: ""
  - name: action_duration
    status: active
    source: design/gdd/interaction-and-timed-actions.md
    referenced_by:
      - design/gdd/interaction-and-timed-actions.md
      - design/gdd/morale-and-mental-state.md
      - design/gdd/body-temperature.md
      - design/gdd/needs-and-weight.md
      - design/gdd/character-controller-and-animation.md
      - design/gdd/shelter.md
    variables:
      - base_game_min
      - action_duration_mult
      - body_action_mult
      - needs_action_mult
      - real_seconds_per_game_minute
    output_range: [0.25, 60]
    expression: "game_min = base_game_min * min(2.0, morale * body * needs); real_s = game_min * real_seconds_per_game_minute(at start)"
    notes: "Cap answers Needs' open note. Character C7 loops the effort segment to fill real_s."
    added: 2026-11-17
    revised: ""
  - name: target_speed
    status: active
    source: design/gdd/character-controller-and-animation.md
    referenced_by:
      - design/gdd/character-controller-and-animation.md
      - design/gdd/terrain-and-snow-surface.md
    variables:
      - move_vector
      - terrain_speed_mult
      - move_speed_mult
      - needs_move_speed_mult
      - carry_speed_mult
      - hurry_mult
    output_range: [0, 1.82]
    expression: "|move_vector| * (Critical ? 0.35 : 1.4) * max(0.15, terrain * (Critical ? 1 : body) * needs * carry * hurry)"
    notes: "Floor answers Terrain's worst-case stack (~5%). Body's 0.40 Critical mult is not applied on top of the crawl base."
    added: 2026-11-17
    revised: ""
  - name: terrain_speed_mult
    status: active
    source: design/gdd/terrain-and-snow-surface.md
    referenced_by:
      - design/gdd/terrain-and-snow-surface.md
    variables:
      - effective_depth_m
      - grade_deg
      - type_speed_mult
    output_range: [0.225, 1.0]
    expression: "max(0.45, 1 - 1.0*snow_depth*(1-compaction)) * (grade<=0 ? 1 : max(0.5, 1 - 0.5*grade/30)) * type_speed_mult"
    notes: "Character multiplies with Body move_speed_mult, Needs move mult and Inventory carry_speed_mult (needs a floor - Character GDD). Grades > 35 deg impassable."
    added: 2026-11-17
    revised: ""
  - name: burn_kcal_per_hour
    status: active
    source: design/gdd/needs-and-weight.md
    referenced_by:
      - design/gdd/needs-and-weight.md
    variables:
      - base_awake
      - base_asleep
      - activity_extra
      - shiver_extra
    output_range: [65, 390]
    expression: "(asleep ? 65 : 110) + max(activity_extra: walk 60, wade 120, light 80, heavy 200) + (shivering ? 80 : 0)"
    notes: "Paid from stomach first, then body reserve at kcal_per_kg. Shivering flag from Body Temperature."
    added: 2026-11-16
    revised: ""
  - name: core_temp_rate
    status: active
    source: design/gdd/body-temperature.md
    referenced_by:
      - design/gdd/body-temperature.md
    variables:
      - effective_temp_c
      - t_neutral
      - k_cool
      - k_warm
      - wetness
      - insulation
      - heat_activity
      - heat_shiver
    output_range: [-4.0, 3.0]
    expression: "clamp((gap<0 ? k_cool*gap*(1+w_wet*wetness)/insulation : k_warm*gap) + heat_activity + heat_shiver, -4, 3); gap = effective_temp_c - t_neutral"
    notes: "Degrees C per game hour. Defaults t_neutral 5, k_cool 0.088, k_warm 0.3, w_wet 1.0. Held at 37.0 max."
    added: 2026-11-16
    revised: ""
  - name: air_temp_c
    status: active
    source: design/gdd/thermal-environment.md
    referenced_by:
      - design/gdd/thermal-environment.md
    variables:
      - daily_mean_temp_c
      - t_swing
      - solar_noon
      - peak_lag
      - hour
      - weather_offset_c
    output_range: [-45, 10]
    expression: "max(t_floor, t_start - t_ramp*(day-1)) + t_swing*cos(2*pi*(hour-(solar_noon+peak_lag))/24) + weather_offset_c"
    notes: "Owns the cold ramp. Defaults t_start -5, t_ramp 0.4, t_floor -25 (day 51), t_swing 4, peak_lag 2.0. Weather (VS) supplies weather_offset_c."
    added: 2026-11-16
    revised: ""
  - name: effective_temp_c
    status: active
    source: design/gdd/thermal-environment.md
    referenced_by:
      - design/gdd/thermal-environment.md
      - design/gdd/body-temperature.md
      - design/gdd/shelter.md
    variables:
      - air_temp_c
      - zone_offset_c
      - wind_chill_c
      - heat_total
      - shelter_bonus_c
    output_range: [-67, 40]
    expression: "air_temp_c + zone_offset_c - min(chill_cap, k_wind*wind_speed*exposure) + min(heat_cap_c, sum(heat_c*(1-(d/r)^2))) + shelter_bonus_c"
    notes: "Felt temperature at a point. Read by Body Temperature each minute_tick. Fire registers heat sources (heat_c, radius_m = its warm_radius)."
    added: 2026-11-16
    revised: ""
  - name: daylight_hours
    status: active
    source: design/gdd/time-and-day-cycle.md
    referenced_by:
      - design/gdd/time-and-day-cycle.md
    variables:
      - d_start
      - d_shrink
      - d_min
      - day
    output_range: [5.0, 8.0]
    expression: "max(d_min, d_start - d_shrink * (day - 1))"
    notes: "Defaults 8.0 / 0.1 / 5.0; sunrise/sunset symmetric around solar_noon 12.5, twilight 0.75 h. Read by Thermal Environment and lighting."
    added: 2026-11-16
    revised: ""
  - name: real_seconds_per_game_minute
    status: active
    source: design/gdd/time-and-day-cycle.md
    referenced_by:
      - design/gdd/time-and-day-cycle.md
    variables:
      - rate_mode
      - phase
    output_range: [0.05, 1.5]
    expression: "day 1.5 | night 1.0 | wait 0.25 | sleep 0.05"
    notes: "Interaction converts game-minute action durations to real time with this."
    added: 2026-11-16
    revised: ""
  - name: morale_reliability_penalty
    status: active
    source: design/gdd/morale-and-mental-state.md
    referenced_by:
      - design/gdd/morale-and-mental-state.md
    variables:
      - mental_state
    output_range: [0, 0.10]
    expression: "penalty_table[mental_state] (Steady 0.00, Strained 0.03, Fraying 0.06, Breaking 0.10)"
    notes: "Added to every action's failure chance by Mishaps & Failure, which clamps the total to <= 0.90."
    added: 2026-11-16
    revised: ""
  - name: morale_action_duration_mult
    status: active
    source: design/gdd/morale-and-mental-state.md
    referenced_by:
      - design/gdd/morale-and-mental-state.md
    variables:
      - mental_state
    output_range: [1.0, 1.20]
    expression: "duration_table[mental_state] (1.00, 1.05, 1.12, 1.20)"
    notes: "Multiplies timed-action durations in Interaction & Timed Actions."
    added: 2026-11-16
    revised: ""
  - name: morale_resolve
    status: active
    source: design/gdd/morale-and-mental-state.md
    referenced_by:
      - design/gdd/morale-and-mental-state.md
    variables:
      - loneliness
      - frustration
      - grief
      - hunger_distress
      - pain
      - a_mean
      - strain_weights
    output_range: [0, 100]
    expression: "100 - (a_mean * weighted_mean(strains) + (1 - a_mean) * max(strains))"
    notes: "Hidden; drives mental_state (falling thresholds 65/40/20, +5 hysteresis). Read by Emotional Feedback, Diary, Tap-out."
    added: 2026-11-16
    revised: ""

