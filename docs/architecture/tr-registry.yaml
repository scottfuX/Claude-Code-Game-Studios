- id: TR-camera-001
  system: camera
  gdd: design/gdd/camera.md
  requirement: "Rig. A pivot follows the survivor; the camera sits at distance from the pivot along a fixed pitch (default 50° down) and the current yaw, looking at the pivot (CA1). Vertical field of view fov 30°. Orthographic projection is not used."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-camera-002
  system: camera
  gdd: design/gdd/camera.md
  requirement: "Follow. The pivot moves toward the survivor's ground position plus a look-ahead in the direction of travel, with exponential smoothing (CA2). Vertical follow is smoothed separately and more slowly, so stepping into a drift (Character's sink) does not bob the camera."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-camera-003
  system: camera
  gdd: design/gdd/camera.md
  requirement: "Turning. camera_turn_left/right rotates the yaw by 45°, eased over 0.4 s; holding repeats every 0.4 s. There is no free mouse-look (Input: mouse is not used in gameplay). Movement input stays relative to the camera's current yaw."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-camera-004
  system: camera
  gdd: design/gdd/camera.md
  requirement: "Zoom. camera_zoom_in/out changes the distance by 3 m per step between d_min 14 m and d_max 40 m, eased over 0.25 s. The chosen distance persists through the run and is saved with settings (Alpha)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-camera-005
  system: camera
  gdd: design/gdd/camera.md
  requirement: "Framing requests. Any system may call request_framing(id, distance_mult, pitch_offset_deg, blend_in_s, blend_out_s, priority, cinematic) and later release_framing(id). The highest-priority active request applies; ties go to the newest. Requests marked cinematic are released automatically by any move or action input, with blend_out_s capped at 1.0 s."
  created: 2026-11-18
  revised: ""
  status: active

