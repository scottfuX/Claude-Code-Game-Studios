- id: TR-morale-and-mental-state-019
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "If several events arrive in the same tick: apply in this order — losses, failures, successes, comforts, rival/medical events — then rate changes, then recompute H, P, R and state once. Rationale: bad news first, so a success in the same tick visibly softens it."
  created: 2026-11-18
  revised: ""
  status: active

