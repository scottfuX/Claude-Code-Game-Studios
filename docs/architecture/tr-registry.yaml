- id: TR-body-temperature-001
  system: body-temperature
  gdd: design/gdd/body-temperature.md
  requirement: "State. The body has core_temp_c (float, starts 37.0) and wetness (float 0–1, starts 0). Clothing insulation comes from the kit (MVP: fixed 1.0)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-body-temperature-002
  system: body-temperature
  gdd: design/gdd/body-temperature.md
  requirement: "Tick. On every minute_tick from Time, Body Temperature queries effective_temp_c(player_position) from Thermal Environment, computes the rate in °C per game hour (B1) and applies rate / 60. Ticks fire during sleep and waiting, so the body keeps cooling during skips."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-body-temperature-003
  system: body-temperature
  gdd: design/gdd/body-temperature.md
  requirement: "Cooling and warming are asymmetric. Below t_neutral (5 °C felt) the body loses heat in proportion to the gap, multiplied by wetness and divided by insulation. Above it, the body regains heat at a faster rate per degree, so a good fire rewarms within one to two game hours. The core never rises above 37.0 °C (no overheating in the MVP)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-body-temperature-004
  system: body-temperature
  gdd: design/gdd/body-temperature.md
  requirement: "Activity heat. The body adds heat by activity, reported by Character Controller (movement) and Interaction (work): idle 0 · walking +0.3 · wading deep snow +0.45 · light work +0.3 · heavy work (chopping, hauling) +0.6 °C per hour. The highest applicable value is used, not the sum. Sleep counts as idle."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-body-temperature-005
  system: body-temperature
  gdd: design/gdd/body-temperature.md
  requirement: "Shivering. In Chilled and Cold the body shivers: +0.3 °C per hour and is_shivering = true (Needs & Weight charges energy for it). In Hypothermic and Critical shivering stops — the body has given up — so cooling speeds up. This is the quiet danger the player must learn."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-body-temperature-006
  system: body-temperature
  gdd: design/gdd/body-temperature.md
  requirement: "Wetness. Wetness rises from events (fell_in_water from Mishaps → 1.0; wading deep snow +0.03 per hour; snowfall from Weather in the VS) and dries by warmth (B2). Wet doubles heat loss at wetness 1.0."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-body-temperature-007
  system: body-temperature
  gdd: design/gdd/body-temperature.md
  requirement: "Stages. Core temperature maps to a stage (B3). Falling uses the threshold; rising needs threshold + 0.2 °C (hysteresis), so the stage does not flicker."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-body-temperature-008
  system: body-temperature
  gdd: design/gdd/body-temperature.md
  requirement: "Effects out. Body publishes core_temp_c, stage, wetness, is_shivering, cold_hands_penalty (Mishaps adds it to failure chance, alongside Morale's penalty, and clamps the total), move_speed_mult (Character Controller), body_action_mult (Interaction multiplies it with Morale's action_duration_mult), allowed_actions in Critical (Interaction), stage_changed, and rate_c_per_hour (debug, HUD trend)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-body-temperature-009
  system: body-temperature
  gdd: design/gdd/body-temperature.md
  requirement: "Waking and interrupting. If the player is asleep or waiting and the stage worsens by one step — or reaches Cold while asleep — Body requests Time's normal mode and emits wake_request(cause = cold); Needs & Weight clears is_asleep. The player wakes shivering with time to act."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-body-temperature-010
  system: body-temperature
  gdd: design/gdd/body-temperature.md
  requirement: "Tap-out is never blocked. Calling extraction (Tap-out & Run Results, VS) stays available in every stage including Critical. In the MVP, which has no tap-out yet, Critical allows only crawl, fire tending (add_fuel, blow_embers, sit_warm), and dropping items."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-body-temperature-011
  system: body-temperature
  gdd: design/gdd/body-temperature.md
  requirement: "Death. At core_temp_c ≤ 30.0 emit body_died(cause = hypothermia) once. In the MVP the run ends and restarts; from the VS, Tap-out & Run Results applies the death penalty. Medical evacuation (VS) is a separate system and may end a run before death."
  created: 2026-11-18
  revised: ""
  status: active

