- id: TR-hud-012
  system: hud
  gdd: design/gdd/hud.md
  requirement: "H1 — Band fill. fill = clamp((core_temp_c − 30) / (37 − 30), 0, 1). Variables: core_temp_c (Body, 30–37). Output Range: 0–1. Examples: 37 → 1.0; 35.5 (Cold boundary) → 0.79; 32 (Critical) → 0.29."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-hud-013
  system: hud
  gdd: design/gdd/hud.md
  requirement: "H2 — Trend. trend = rate ≥ +1.0 ? ▶▶ : rate ≥ +0.1 ? ▶ : rate ≤ −1.0 ? ◀◀ : rate ≤ −0.1 ? ◀ : none. Variables: rate (Body B1, °C per game hour). Examples: standing idle on day 1 (−0.81) → ◀; night with no fire (−1.49) → ◀◀; 1 m from a fire (+1.6) → ▶▶."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-hud-014
  system: hud
  gdd: design/gdd/hud.md
  requirement: "H3 — Calm fade. opacity = calm_for ≥ calm_s ? calm_alpha : 1.0, eased 0.5 s up / 1.5 s down. Variables: calm_alpha 0.35, calm_s 8 real s (data file); calm = Warm, no trend, no need warning, no prompt. Output Range: 0.35–1.0."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-hud-015
  system: hud
  gdd: design/gdd/hud.md
  requirement: "H4 — Need icon level. level = stage ∈ {Tired, Thirsty, Hungry} ? warn : stage ∈ {Exhausted, Parched, Empty, Starving} ? urgent : hidden. Output: hidden · warn · urgent (one per need)."
