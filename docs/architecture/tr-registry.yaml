- id: TR-terrain-and-snow-surface-001
  system: terrain-and-snow-surface
  gdd: design/gdd/terrain-and-snow-surface.md
  requirement: "Terrain shape. The map's landform is defined by a heightmap (resolution set by Map & Resource Distribution; target ≤ 1 m per sample). It provides height, surface normal and slope_deg at any point, plus collision. Slopes the player can walk are ≤ slope_max_deg (default 35°); steeper ground is impassable (cliffs, rock faces)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-terrain-and-snow-surface-002
  system: terrain-and-snow-surface
  gdd: design/gdd/terrain-and-snow-surface.md
  requirement: "Readable landform. Terrain is rendered with flat per-face shading (art bible §1 大块面, §3 \"雪地是缓坡大平面\"): every slope of 5° or more must show a visible value step between faces facing the sun and faces away from it at the gameplay camera, so the land reads without texture. The lake basin is a flat plane; drifts are long, soft mounds on the lee side of trees and rocks."
  created: 2026-11-18
  revised: ""
  status: active

