  requirement: "Dehydration death. If hydration stays at 0 for dehydration_grace_h (6 game hours), emit needs_died(cause = dehydration) once. Any drink resets the grace timer."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-needs-and-weight-012
