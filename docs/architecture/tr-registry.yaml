- id: TR-needs-and-weight-001
  system: needs-and-weight
  gdd: design/gdd/needs-and-weight.md
  requirement: "State. stomach_kcal (0–1,500; fullness = stomach_kcal / 15, 0–100), weight_kg (start = start_weight_kg, default 72.0), hydration (0–100, start 100), energy (0–energy_cap, start 90), is_asleep (bool, start false). The run starts with stomach_kcal 1,200 (fullness 80 — the survivor ate before the drop)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-needs-and-weight-002
  system: needs-and-weight
  gdd: design/gdd/needs-and-weight.md
  requirement: "Tick. On every minute_tick from Time, apply N1–N4 for one game minute, including during sleep and waiting."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-needs-and-weight-003
  system: needs-and-weight
  gdd: design/gdd/needs-and-weight.md
  requirement: "Burn. Calories burnt per hour = base (awake 110 / asleep 65) + the highest activity extra (walking 60 · wading deep snow 120 · light work 80 · heavy work 200) + shivering 80 when Body Temperature reports is_shivering. Activity comes from Character Controller and Interaction (the same reports Body Temperature uses)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-needs-and-weight-004
  system: needs-and-weight
  gdd: design/gdd/needs-and-weight.md
  requirement: "Stomach first, then the body. Each minute's burn is taken from stomach_kcal; any shortfall is taken from body reserve and lowers weight_kg (N2). Weight never rises above start_weight_kg; in the MVP it never rises at all (open question)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-needs-and-weight-005
  system: needs-and-weight
  gdd: design/gdd/needs-and-weight.md
  requirement: "Eating. Eating a food item (Interaction) adds its food_kcal (Item Database) to the stomach. If it would exceed 1,500 kcal, eating is refused (\"吃不下\") and the item is kept. Eating takes the item's eat_minutes (default 5 game minutes)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-needs-and-weight-006
  system: needs-and-weight
  gdd: design/gdd/needs-and-weight.md
  requirement: "Drinking. Drinking adds the item's drink_hydration. MVP stand-in — eating snow: an action available anywhere on snow: +3 hydration, 3 game minutes, −1 energy per handful. It is slow and tiring on purpose; melting and boiling water (Water, VS) is the good way."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-needs-and-weight-007
  system: needs-and-weight
  gdd: design/gdd/needs-and-weight.md
  requirement: "Hydration drain (N3): −1.4 per hour awake, −0.7 asleep, ×1.5 while wading or doing heavy work."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-needs-and-weight-008
  system: needs-and-weight
  gdd: design/gdd/needs-and-weight.md
  requirement: "Energy (N4): drains by activity (idle 1.0 · walking 2.0 · light work 2.5 · wading 3.5 · heavy work 5.0 per hour, highest applies) + 1.5 while shivering; resting by a burning fire in wait mode restores +1.5 per hour instead of draining; sleep restores 8 per hour × warmth quality × food quality. Energy cannot exceed energy_cap, which falls as weight is lost (N5)."
  created: 2026-11-18
  revised: ""
  status: active

