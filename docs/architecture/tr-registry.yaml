- id: TR-time-and-day-cycle-001
  system: time-and-day-cycle
  gdd: design/gdd/time-and-day-cycle.md
  requirement: "One clock. Game time is a single value: day (int, ≥ 1) and minute_of_day (0–1439). hour = minute_of_day / 60 (float, 0–24). No other system keeps its own clock."
