- id: TR-interaction-and-timed-actions-015
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "IA4 — Attempt rhythm (repeat mode). Minimum time between attempts = base_game_min × dur_mult × real_seconds_per_game_minute; strike by day, healthy → 0.75 s per strike; Hypothermic (1.25) + Tired (1.10) → 1.03 s. The 3-second idle timeout returns to Free."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-interaction-and-timed-actions-016
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "If the target disappears mid-action (a pile emptied by another action, a fire going out during add_fuel): cancel; progress is discarded."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-interaction-and-timed-actions-017
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "If the tool breaks on the use that completes an action: the result still applies; the next start is refused (\"没有斧头\")."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-interaction-and-timed-actions-018
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "If the player moves during a non-cancellable action (none in the MVP): movement is ignored until it ends."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-interaction-and-timed-actions-019
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "If Body enters Critical during a non-critical action: cancel immediately; only critical_allowed actions remain."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-interaction-and-timed-actions-020
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "If Needs collapses the survivor: cancel and hand to the collapse override (Character)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-interaction-and-timed-actions-021
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "If the survivor falls through ice mid-action (fell_in_water): cancel immediately, the same way Critical entry does, including non-cancellable and critical_allowed actions; the interrupted work or attempt sends no result, tool use or Mishaps roll; kept progress stays on the target; Character takes over with In-water. If fell_in_water and a death event arrive in the same tick, the death event wins."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-interaction-and-timed-actions-022
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "If two interactables tie on score: keep the current target; else the nearer."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-interaction-and-timed-actions-023
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "If day turns to night during an action: the start rate is kept until the action ends."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-interaction-and-timed-actions-024
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "If the player taps interact on a repeat action faster than the attempt rhythm: one press is buffered; extra presses are dropped."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-interaction-and-timed-actions-025
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "If the backpack is full when an action produces items (chop_log): the resolver drops the produce on the ground at the survivor's feet as a pile (Inventory); no item is lost."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-interaction-and-timed-actions-026
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "If rest is running and the fire goes out: stop and request Time normal."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-interaction-and-timed-actions-027
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "If the game is saved during an action: the action is not saved; on load the survivor is Free and any kept progress is on the target."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-interaction-and-timed-actions-028
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "If eating is cancelled: nothing is consumed and no calories are added."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-interaction-and-timed-actions-029
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "If the backpack opens during an action: the backpack does not pause time, so the action keeps running; opening it does not cancel. The pause menu pauses everything, including the action."
