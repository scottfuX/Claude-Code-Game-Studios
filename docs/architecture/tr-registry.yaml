- id: TR-interaction-and-timed-actions-005
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "Starting. Pressing interact/secondary (a tap — Input IN2) on an available action starts it if: the tool is in the backpack, Body allows it (critical_allowed in Critical), Needs allows it (no heavy actions when Exhausted), and no other action is running. Otherwise the action is refused with a short diegetic reason (\"没有斧头\", \"手抬不起来了\", \"太累了\")."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-interaction-and-timed-actions-006
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "Running."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-interaction-and-timed-actions-007
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "Cancelling. Movement input or cancel_action stops a cancellable action. If progress_kept, progress fraction stays on the target (a half-chopped log resumes where it stopped); otherwise it is lost (an interrupted meal eats nothing). Collapse (Needs), entering Critical (unless critical_allowed), falling into water (Mishaps fell_in_water), the target disappearing, or the tool breaking/being lost cancel at once. On fell_in_water the cancel applies even to non-cancellable actions: no result, tool use or Mishaps roll is sent for the interrupted work or attempt, progress follows progress_kept, and control passes to Character's In-water state."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-interaction-and-timed-actions-008
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "Effort reporting. While an action runs, Interaction reports its intensity as the work activity (light / heavy) to Body Temperature and Needs & Weight; they take the highest of work and Character's movement activity."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-interaction-and-timed-actions-009
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "Idle and resting. is_idle = no movement for ≥ 2 real seconds and (no action running, or the running action has counts_as_idle). resting_at_fire = the rest action is running and the survivor is inside a burning fire's warm_radius — the input Needs & Weight's e_rest uses."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-interaction-and-timed-actions-010
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "Duration multipliers. All slow-downs multiply and are capped at max_duration_mult (2.0) (IA1). Real duration uses the Time rate at the action's start."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-interaction-and-timed-actions-011
  system: interaction-and-timed-actions
  gdd: design/gdd/interaction-and-timed-actions.md
  requirement: "One action at a time. No queueing beyond Input's 0.15 s buffer; the survivor's hands do one thing."
  created: 2026-11-18
  revised: ""
  status: active

