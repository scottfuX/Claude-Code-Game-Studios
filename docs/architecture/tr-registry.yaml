- id: TR-morale-and-mental-state-001
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "§1 Feeling map (owns the project-wide contract). Each feeling the owner named has one mechanical home, the show features that feed it, what relieves it, and how it is shown. Systems marked VS arrive in the Vertical Slice; their inputs are absent (zero) in the MVP."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-002
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "§2 Strain values. Each strain is a float 0–100 (0 = untouched, 100 = overwhelmed). L, F, G are stored and change by rate and by events (Formulas F1–F3). H and P are recomputed every tick from their source systems (F4–F5) and never stored."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-003
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "§3 Tick. Morale updates once per game minute while the game is unpaused, using the game-hour rates in Formulas scaled by elapsed game time. While sleeping, the sleep multipliers apply. Paused time, menus (excluding the non-pausing backpack/inventory per resolved QQ-08) and loading accrue nothing."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-004
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "§4 Resolve and state. After strains update, Resolve R (F6) is recomputed and the mental state is re-evaluated with hysteresis (States and Transitions)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-005
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "§5 Events in. Morale reacts to events, each applied once, in the fixed order Edge Cases defines (losses → failures → successes → comforts → rival/medical):"
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-006
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "§6 Ritual moments (detected by Morale). \"Slow, ritual-like\" beats are rewarded, never required:"
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-007
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "§7 Second wind. The first time per day the state is Breaking and a meaningful success or a ritual moment occurs, apply an extra F −20 and L −10 on top of its normal effect. This is the show's \"one small win saves you\" and the damper on the despair spiral."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-008
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "§8 Effects out. Morale publishes, every tick:"
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-009
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "§9 The tap-out offer. At every nightfall (Time is_night turns true) on which the state is Fraying or Breaking, emit one tap_out_offer: strength = \"quiet\" normally, \"plea\" (the survivor says it: \"我想回家\") when this is at least the second consecutive nightfall in Breaking. The consecutive-Breaking count resets to zero at any nightfall spent below Breaking, including a Fraying one. At most one offer per night. Morale never ends a run and never forces the choice; Tap-out & Run Results (VS) owns the prompt and the decision. In the MVP, the offer only triggers its Feedback beat."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-010
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "§10 Keepsakes (VS/Alpha contract). A carried keepsake multiplies the gain of one stored strain by k_keepsake (default 0.85). Multiple keepsakes on the same strain multiply but the product is floored at 0.70. Keepsakes affect Morale only — no direct survival effect (owner decision, 2026-11-16); their survival value is the indirect, bounded one of F7."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-011
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "§11 What Morale never does. It never shows a number or bar in play, never kills, never triggers medical evacuation, never blocks an action outright, and never takes control from the player (ritual moments happen only because the player chose to stop)."
  created: 2026-11-18
  revised: ""
  status: active

