- id: TR-item-database-and-inventory-001
  system: item-database-and-inventory
  gdd: design/gdd/item-database-and-inventory.md
  requirement: "Items are data. Every item is a row in a data file. Systems refer to items by id only; no system hard-codes item values."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-item-database-and-inventory-002
  system: item-database-and-inventory
  gdd: design/gdd/item-database-and-inventory.md
  requirement: "Item fields:"
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-item-database-and-inventory-003
  system: item-database-and-inventory
  gdd: design/gdd/item-database-and-inventory.md
  requirement: "Containers."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-item-database-and-inventory-004
  system: item-database-and-inventory
  gdd: design/gdd/item-database-and-inventory.md
  requirement: "Picking up and dropping. Picking up adds to the backpack only if the new total mass ≤ carry_capacity_kg; otherwise the pick-up takes as many units as fit and refuses the rest (\"背不动了\"). Dropping is always allowed. Both are Interaction actions; this GDD defines the result."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-item-database-and-inventory-005
  system: item-database-and-inventory
  gdd: design/gdd/item-database-and-inventory.md
  requirement: "Stacks and wetness. Each stack of a can_get_wet item has one wetness (0–1). Merging two stacks gives the mass-weighted average wetness. Wetness rises from events (fell_in_water → backpack fuel and tinder set to 1.0; snowfall on uncovered world piles, VS) and dries by I4. Fire and Mishaps read wetness (damp tinder fails; wet wood smokes)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-item-database-and-inventory-006
  system: item-database-and-inventory
  gdd: design/gdd/item-database-and-inventory.md
  requirement: "Durability. Each tool stack (always stack_max 1) has durability from durability_max. Interaction reports a *use* (one swing, one strike); durability falls by 1. Mishaps may report a *damage* event (e.g. −50 for a bad swing into frozen wood). At 0 the tool breaks: it is removed and emits loss{kind: item_lost, item_class: tool}."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-item-database-and-inventory-007
  system: item-database-and-inventory
  gdd: design/gdd/item-database-and-inventory.md
  requirement: "Losses. Any removal not by use, eating or burning — a tool through the ice, a dropped item lost in deep snow (Mishaps decides when) — emits loss{kind: item_lost, item_class: tool | other} with the item id. Morale & Mental State turns it into grief (F3)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-item-database-and-inventory-008
  system: item-database-and-inventory
  gdd: design/gdd/item-database-and-inventory.md
  requirement: "Consumption. Eating, drinking and burning remove units at the request of the consuming system (Needs & Weight, Fire); they never emit loss."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-item-database-and-inventory-009
  system: item-database-and-inventory
  gdd: design/gdd/item-database-and-inventory.md
  requirement: "Load and speed. Inventory publishes carry_load_frac (I1) and carry_speed_mult (I2). Character Controller multiplies it with Body Temperature's and Needs & Weight's movement multipliers. A full pack also adds the \"hauling\" activity flag, which Body Temperature and Needs & Weight treat as heavy work while walking (heat +0.6, energy −5 per hour, burn +200 kcal per hour)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-item-database-and-inventory-010
  system: item-database-and-inventory
  gdd: design/gdd/item-database-and-inventory.md
  requirement: "Insulation. Inventory publishes insulation (I3) to Body Temperature: the worn clothing's value; the sleeping bag's bonus is defined but inactive in the MVP (Body Temperature, approved, fixes MVP insulation at 1.0)."
