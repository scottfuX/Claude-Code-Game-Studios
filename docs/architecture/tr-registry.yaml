- id: TR-thermal-environment-001
  system: thermal-environment
  gdd: design/gdd/thermal-environment.md
  requirement: "One question, one answer. effective_temp_c(p) = air temperature + zone offset − wind chill + heat from sources at p (Formula TH5). It is a felt temperature in °C, not a physical simulation."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-thermal-environment-002
  system: thermal-environment
  gdd: design/gdd/thermal-environment.md
  requirement: "Cold ramp. The daily mean air temperature falls by a fixed amount each day from t_start to a floor t_floor (TH1). Thermal owns this ramp."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-thermal-environment-003
  system: thermal-environment
  gdd: design/gdd/thermal-environment.md
  requirement: "Day and night swing. Around the daily mean, air temperature follows a 24-hour cosine peaking peak_lag hours after solar noon (mid-afternoon) and lowest 12 hours later (TH2). Solar noon is read from Time ((sunrise_hour + sunset_hour) / 2)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-thermal-environment-004
  system: thermal-environment
  gdd: design/gdd/thermal-environment.md
  requirement: "Zones. Every point belongs to a zone supplied by Map & Resource Distribution, each with a zone_offset_c and a wind_exposure (0–1):"
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-thermal-environment-005
  system: thermal-environment
  gdd: design/gdd/thermal-environment.md
  requirement: "Wind. wind_speed (m/s) is a world value. In the MVP Thermal supplies it as a data constant (wind_base, default 3 m/s); from the VS, Weather & Cold Snaps registers as the wind source and overrides it. Wind chill scales with wind speed × exposure and is capped (TH3)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-thermal-environment-006
  system: thermal-environment
  gdd: design/gdd/thermal-environment.md
  requirement: "Heat sources. A system registers a heat source with {id, position, heat_c, radius_m, enabled} and updates it when it changes. Each contributes heat that falls off to zero at its radius (TH4). All sources at a point are summed, then capped at heat_cap_c. Fire is the only MVP source; Fire owns heat_c and radius_m and publishes that same radius as warm_radius (the value Morale reads)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-thermal-environment-007
  system: thermal-environment
  gdd: design/gdd/thermal-environment.md
  requirement: "Insulation volumes (VS contract). A shelter registers a volume {id, bounds, wind_exposure_override, bonus_c, heat_reflect_mult}. Inside it, wind exposure is replaced by the override, bonus_c is added, and heat from sources inside or at the opening is multiplied by heat_reflect_mult. Shelter owns the values; Thermal applies them."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-thermal-environment-008
  system: thermal-environment
  gdd: design/gdd/thermal-environment.md
  requirement: "Chill offsets (VS contract). Weather registers {air_offset_c, wind_speed} (cold snaps lower air temperature; storms raise wind). Offsets are added to TH2's result."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-thermal-environment-009
  system: thermal-environment
  gdd: design/gdd/thermal-environment.md
  requirement: "Evaluation. Thermal holds no per-point state. Consumers query on demand; Body Temperature queries the player's position once per game minute (minute_tick). Results are deterministic for the same inputs."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-thermal-environment-010
  system: thermal-environment
  gdd: design/gdd/thermal-environment.md
  requirement: "Published values: effective_temp_c(p), components(p) → {air, zone, wind_chill, heat, shelter_bonus}, air_temp_c (world), wind_speed, wind_eff(p), is_sheltered(p)."
  created: 2026-11-18
  revised: ""
  status: active

