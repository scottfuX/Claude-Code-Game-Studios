  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "If R sits exactly on a threshold: falling uses strict < (R = 65.0 does not leave Steady), rising uses ≥ the +5 value (R = 70.0 returns to Steady)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-023
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "If start_weight_kg ≤ 0 or missing: treat weight loss as 0 and log an error; H falls back to the fullness term only."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-024
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "If t_comfort ≤ t_max_pain from bad data: reject the data at load and use the defaults (36.5 / 33.0)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-025
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "If the player gains weight above start weight: wl is 0, never negative — weight gain does not create a happiness bonus."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-026
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "If the player repeats a trivially easy action to farm successes: no F relief — only meaningful successes lift F (Core Rules §5). A trivial success still clears that action's failure streak (F2), but a trivial action rarely fails, so this cannot be exploited."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-027
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "If the player stands idle at the fire for hours: fire rituals cap at one per game hour and three per day; the fire still burns fuel and the day still passes."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-028
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "If the player records more than one diary entry a night (VS): only the first diary_recorded per night counts."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-029
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "If second wind's conditions are met more than once a day: only the first applies."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-030
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "If the state is Breaking at nightfall for two consecutive nights, and the player refuses the plea: no further penalty; the plea repeats at most once per night while Breaking continues."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-031
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "If a Fraying (or lower) night falls between two Breaking nights: the consecutive-Breaking count resets, so the next Breaking nightfall offers \"quiet\" again (Core Rules §9)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-032
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "If the player dies or is evacuated while Fraying or Breaking: no extra effect; final values are frozen for Results and Diary."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-033
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "If the player sleeps through nightfall: the tap-out offer for that night fires at wake-up if the state still qualifies; at most one per night."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-034
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "If a game is loaded (Alpha): L, F, G, state, nights-in-Breaking and the per-day caps are restored exactly; H and P recompute from their sources on the first tick without emitting spikes."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-035
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "If an event names an unknown action_type, kind or severity: ignore it and log a warning — no default severity is guessed."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-036
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "If time is skipped (sleep, waiting): accrual integrates over the skipped game minutes with the sleeping multipliers; ritual moments cannot occur during a skip."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-morale-and-mental-state-037
  system: morale-and-mental-state
  gdd: design/gdd/morale-and-mental-state.md
  requirement: "If no Diary, Wildlife, Rivals or keepsakes exist (MVP): their comforts are simply absent; the MVP's reliefs are successes, fire rituals, sunrise, rest and sleep."
  created: 2026-11-18
  revised: ""
  status: active

