- id: TR-mishaps-and-failure-001
  system: mishaps-and-failure
  gdd: design/gdd/mishaps-and-failure.md
  requirement: "Profiles. Each action that can fail names a mishap_profile (Interaction's action table). A profile defines: base_fail, its situational cause terms (which apply and their weights), severity on failure (minor / moderate / major — Morale's F2 values 4 / 8 / 15), tag (helplessness / disappointment), and on_fail consequences."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-mishaps-and-failure-002
  system: mishaps-and-failure
  gdd: design/gdd/mishaps-and-failure.md
  requirement: "MVP profiles (provisional values; Fire and Gathering may refine their own):"
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-mishaps-and-failure-003
  system: mishaps-and-failure
  gdd: design/gdd/mishaps-and-failure.md
  requirement: "One roll per attempt. Interaction sends one attempt per timed completion or per repeat attempt; Mishaps rolls once and returns outcome{success, cause, severity, tag, p_fail} to Interaction (which tells the resolver) and emits action_outcome to Morale (Morale §5): {action_type, success, cause, severity, tag, base_fail_chance = base_fail}. Morale computes streaks and decides which successes are meaningful (its constant 0.10)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-mishaps-and-failure-004
  system: mishaps-and-failure
  gdd: design/gdd/mishaps-and-failure.md
  requirement: "Failure chance (M1) = base + situational causes + state penalties, clamped to [0, p_cap] with p_cap = 0.90 — the clamp Morale, Body Temperature and Needs & Weight already rely on. No action is ever impossible."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-mishaps-and-failure-005
  system: mishaps-and-failure
  gdd: design/gdd/mishaps-and-failure.md
  requirement: "Visible cause (M2). The named cause is the largest contributor among the *physical* terms — damp, wind, tinder, cold_hands, fatigue — if it is ≥ cause_min (0.05); otherwise fumble. Morale's penalty is never named; it tips the odds silently (\"Unfair never\", Morale Game Feel). The cause is shown before the outcome lands (Emotional Feedback / Character): smoke and hiss for damp, sparks blown sideways for wind, a rod slipping from shaking hands for cold, a weak swing for fatigue, sparks dying on poor tinder, a plain fumble otherwise."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-mishaps-and-failure-006
  system: mishaps-and-failure
  gdd: design/gdd/mishaps-and-failure.md
  requirement: "Learnable causes. Every situational term is something the player can change: dry the tinder at the fire (Inventory I4), build the fire in the lee of rocks or trees (Thermal zones), use birch bark over sticks (Item table quality), warm up before striking (Body), rest (Needs). This is where the player's knowledge across runs lives."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-mishaps-and-failure-007
  system: mishaps-and-failure
  gdd: design/gdd/mishaps-and-failure.md
  requirement: "Bad-luck protection (M3). If the last streak_guard (4) attempts of the same action all failed with cause fumble, the next attempt's chance is halved. It never applies when the dominant cause is damp, wind, tinder, cold hands or fatigue — those are the player's to fix."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-mishaps-and-failure-008
  system: mishaps-and-failure
  gdd: design/gdd/mishaps-and-failure.md
  requirement: "Thin ice (M4). On every footfall on a lake-ice cell thinner than t_safe_cm (15 cm), roll a break. On a break: the cell becomes broken (Terrain), emit fell_in_water (Body sets wetness 1.0; Inventory soaks backpack fuel and tinder), Character enters In-water and climbs out at the nearest edge, Morale receives a major helplessness failure, and with p_tool_loss (0.10) one carried tool (hatchet, knife or ferro rod, weighted 2 : 1 : 1) is lost → Inventory loss{item_lost, tool}. The darker, thinner ice is visible before it breaks (Terrain Visual)."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-mishaps-and-failure-009
  system: mishaps-and-failure
  gdd: design/gdd/mishaps-and-failure.md
  requirement: "Consequences go to their owners. Mishaps only *requests*: durability damage → Inventory; wasted items → Inventory; embers dying → Fire; ice break → Terrain; soak → Body and Inventory. It never changes another system's state directly."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-mishaps-and-failure-010
  system: mishaps-and-failure
  gdd: design/gdd/mishaps-and-failure.md
  requirement: "Randomness. All rolls use one seeded random stream per run (seed saved), so a reloaded run repeats the same luck and QA can reproduce sequences."
  created: 2026-11-18
  revised: ""
  status: active

