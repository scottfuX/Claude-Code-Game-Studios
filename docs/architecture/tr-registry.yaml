- id: TR-camera-007
  system: camera
  gdd: design/gdd/camera.md
  requirement: "Occlusion. Scenery between the camera and the survivor (trees, rocks, the shelter) fades to occluder_alpha (30 %) using a dithered fade, never popping (CA5). The survivor itself is never faded. Terrain cannot occlude at these pitches; if a ridge would (steep slope below the camera), the pivot height is raised until the line of sight is clear."
  created: 2026-11-18
  revised: ""
  status: active

- id: TR-camera-008
