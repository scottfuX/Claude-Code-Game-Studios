  gdd: design/gdd/terrain-and-snow-surface.md
  requirement: "Surface grid. A grid of cell_size_m cells covers the playable map. Each cell stores type, snow_depth_m (0–1.5) and compaction (0–c_max). Map & Resource Distribution authors the initial values; Weather (VS) adds snowfall."
  created: 2026-11-18
  revised: ""
  status: active

