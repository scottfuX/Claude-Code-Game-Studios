# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: explicit_run_owner_ports
    status: active
    pattern: direct_call
    producer: RunCoordinator
    consumers: [InputRouter, Clock, Core, Feature, Presentation]
    adr: docs/architecture/adr-0001-run-scene-composition-and-service-lifecycle.md
    interface: "Inject narrow typed ports before activation; snapshots contain detached values/IDs; owner-only writes; invalidate run tokens before teardown."
    referenced_by:
      - docs/architecture/adr-0002-input-routing-contexts-and-ui-pause-requests.md
      - docs/architecture/adr-0003-ordered-clock-dispatch-typed-events-and-run-randomness.md
    notes: "Proposed source; not an Accepted stance."
    added: 2026-11-18
    revised: ""
  - contract: ui_context_and_pause_requests
    status: active
    pattern: direct_call
    producer: UI-and-input-recovery-adapters
    consumers: [RunCoordinator, InputRouter, Clock, ActionRunner]
    adr: docs/architecture/adr-0002-input-routing-contexts-and-ui-pause-requests.md
    interface: "request_ui_context(source, open); request_pause(source) -> PauseToken; release_pause(token)"
    referenced_by:
      - docs/architecture/adr-0003-ordered-clock-dispatch-typed-events-and-run-randomness.md
    notes: "Proposed ADR; Scott decided QQ-08 backpack UI does not pause simulation/actions; explicit pause menu does. Loading/disconnect safety gates remain. Time Rule 8 GDD fix pending separately."
    added: 2026-11-18
    revised: ""
  - contract: ordered_minute_dispatch
    status: active
    pattern: direct_call
    producer: RunCoordinator
    consumers: [ThermalField, FireController, InventoryModel, BodyThermoregulation, NeedsModel, MoraleModel, Presentation]
    adr: docs/architecture/adr-0003-ordered-clock-dispatch-typed-events-and-run-randomness.md
    interface: "step_minute(context) staged synchronously; public GDD minute_tick/boundary signals notify only, never a second integration path"
    referenced_by: []
    notes: "Proposed ADR; pre-step activity, Thermal, Fire, Inventory, Body, Needs, terminal arbitration, Morale, publication; run-tagged typed events; C4/C5 must ratify exact consumer boundaries."
    added: 2026-11-18
    revised: ""

  - contract: thermal_owner_sources_and_same_minute_publication
    status: active
    pattern: direct_call
    producer: FireController
    consumers: [ThermalField, BodyThermoregulation, InventoryModel]
    adr: docs/architecture/adr-0006-thermal-spatial-queries-and-source-registration.md
    interface: "register_heat_source; update_heat_source; unregister_heat_source; begin_minute then Fire publication then seal_sources before Body"
    referenced_by: []
    notes: "Proposed source; run/owner/revision validation, disabled retained at heat0, invalid source contributes0; Fire warm_radius equals registered radius; no Core concrete Fire import."
    added: 2026-11-18
    revised: ""

  - contract: prepared_action_commits_and_terminal_arbitration
    status: active
    pattern: direct_call
    producer: RunCoordinator
    consumers: [ActionRunner, MishapResolver, InventoryModel, BodyThermoregulation, NeedsModel, Presentation]
    adr: docs/architecture/adr-0007-timed-action-transactions-seeded-mishaps-and-simultaneous-death-precedence.md
    interface: "validate_plan; commit_plan with consequence_id; submit_terminal_candidate; forced cancel before completion checkpoint"
    referenced_by: []
    notes: "Proposed source; non-yielding owner commits, cause before result, exactly one terminal; hypothermia > dehydration, death > collapse/immersion; Rule7 immersion already resolved."
    added: 2026-11-18
    revised: ""

  - contract: survival_pre_post_samples_and_wake_mode_barrier
    status: active
    pattern: direct_call
    producer: RunCoordinator
    consumers: [BodyThermoregulation, NeedsModel, Clock, ActionRunner]
    adr: docs/architecture/adr-0008-body-needs-minute-integration-sleep-and-terminal-candidate-ports.md
    interface: "MinuteStart -> BodyStepResult -> NeedsStepResult -> C4 terminal gate -> coalesced wake and Clock normal/sleep/wait arbitration"
    referenced_by: []
    notes: "Proposed source; captured sleep/fullness/stages, post-Body shiver/stage, per-minute integration even in skip; normal wins before next tick, no Fire low alarm; no duplicate public terminal."
    added: 2026-11-18
    revised: ""

