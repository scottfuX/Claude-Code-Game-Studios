# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: global_mutable_gameplay_or_foreign_owner_writes
    status: active
    adr: docs/architecture/adr-0001-run-scene-composition-and-service-lifecycle.md
    reason: "Proposed ADR; gameplay autoloads, mutable shared definition Resources and cross-owner state writes defeat run isolation."
    alternative: explicit-run-owned-ports-and-detached-snapshots
    referenced_by:
      - docs/architecture/adr-0002-input-routing-contexts-and-ui-pause-requests.md
      - docs/architecture/adr-0003-ordered-clock-dispatch-typed-events-and-run-randomness.md
    added: 2026-11-18
    revised: ""
  - pattern: ui_context_implies_simulation_pause
    status: active
    adr: docs/architecture/adr-0002-input-routing-contexts-and-ui-pause-requests.md
    reason: "Proposed ADR; violates Scott's QQ-08 backpack exception."
    alternative: separate-context-sources-and-coordinator-pause-tokens
    referenced_by:
      - docs/architecture/adr-0003-ordered-clock-dispatch-typed-events-and-run-randomness.md
    added: 2026-11-18
    revised: ""
  - pattern: unordered_or_duplicate_survival_integration
    status: active
    adr: docs/architecture/adr-0003-ordered-clock-dispatch-typed-events-and-run-randomness.md
    reason: "Proposed ADR; independent survival clocks, signal connection order, skipped debt and double integration invalidate reproducibility."
    alternative: one-clock-and-staged-once-only-coordinator-dispatch
    referenced_by: []
    added: 2026-11-18
    revised: ""

